version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Backend (Airflow Metadata & MLflow Tracking Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: telcosense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telcosense_admin
      POSTGRES_PASSWORD: telcosense_secure_password
      POSTGRES_DB: telcosense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telcosense_admin -d telcosense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telcosense-net

  # ---------------------------------------------------------------------------
  # 2. Qdrant Vector Engine
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: telcosense-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - telcosense-net

  # ---------------------------------------------------------------------------
  # 3. MLflow Tracking Server & Model Registry
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: telcosense-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://telcosense_admin:telcosense_secure_password@postgres:5432/telcosense_db
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://telcosense_admin:telcosense_secure_password@postgres:5432/telcosense_db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - telcosense-net

  # ---------------------------------------------------------------------------
  # 4. Apache Airflow (Init, Webserver & Scheduler)
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.2-python3.11
    container_name: telcosense-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://telcosense_admin:telcosense_secure_password@postgres:5432/telcosense_db
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    command: version
    networks:
      - telcosense-net

  airflow-webserver:
    image: apache/airflow:2.8.2-python3.11
    container_name: telcosense-airflow-webserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://telcosense_admin:telcosense_secure_password@postgres:5432/telcosense_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./mlruns:/opt/airflow/mlruns
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - telcosense-net

  airflow-scheduler:
    image: apache/airflow:2.8.2-python3.11
    container_name: telcosense-airflow-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://telcosense_admin:telcosense_secure_password@postgres:5432/telcosense_db
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./mlruns:/opt/airflow/mlruns
    command: scheduler
    networks:
      - telcosense-net

  # ---------------------------------------------------------------------------
  # 5. FastAPI TelcoSense Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telcosense-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - USE_TF=0
      - USE_TORCH=1
      - TRANSFORMERS_NO_TF=1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    networks:
      - telcosense-net

volumes:
  postgres_data:
  qdrant_storage:
  mlflow_artifacts:

networks:
  telcosense-net:
    driver: bridge
